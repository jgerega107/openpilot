name: Sync release-mici Crosstrek source branch

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-release-mici-crosstrek-2025
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'jgerega107/openpilot' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Crosstrek source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: release-mici-crosstrek-2025

      - name: Replay fork commits on stable source
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/commaai/openpilot.git
          git fetch --no-tags upstream refs/heads/release-mici:refs/sync/release

          before="$(git rev-parse HEAD)"
          release_snapshot="$(git rev-parse refs/sync/release)"
          release_version="$(git show refs/sync/release:RELEASES.md | sed -n 's/^Version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          current_version="$(sed -n 's/^Version \([0-9][0-9.]*\).*/\1/p' RELEASES.md | head -1)"
          test -n "$release_version"
          test -n "$current_version"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          oldest="$(printf '%s\n%s\n' "$current_version" "$release_version" | sort -V | head -1)"
          if test "$release_version" != "$current_version" && test "$oldest" = "$release_version"; then
            echo "Skipping older stable v$release_version (current v$current_version)"
            exit 0
          fi

          # The version tag can differ from the shipped stable build (for
          # example, release-only reverts). Require the build's exact source.
          recorded_source="$(git show refs/sync/release:git_src_commit | tr -d '[:space:]')"
          [[ "$recorded_source" =~ ^[0-9a-f]{40}$ ]]
          if ! git fetch --no-tags upstream "$recorded_source:refs/sync/source"; then
            echo "::error::Stable build source $recorded_source is unavailable upstream. Refusing to substitute the version tag."
            exit 1
          fi
          source="$(git rev-parse 'refs/sync/source^{commit}')"
          source_version="$(git show "$source:RELEASES.md" | sed -n 's/^Version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          test "$source_version" = "$release_version"
          echo "Stable build: $release_snapshot; source: $source (v$release_version)"
          if git merge-base --is-ancestor "$source" HEAD; then
            echo "Already based on this stable source; nothing to replay"
            exit 0
          fi

          base="$(git merge-base HEAD "$source")"
          # Refuse historical merge-based branches or upstream commits in the
          # replay range. Only the fork's dependency and CI commits belong here.
          test -z "$(git rev-list --merges "$base..HEAD")"
          while IFS= read -r path; do
            case "$path" in
              .gitmodules|opendbc_repo|.github/workflows/*) ;;
              *) echo "Unexpected fork change requiring review: $path" >&2; exit 1 ;;
            esac
          done < <(git log --format= --name-only "$base..HEAD" | sed '/^$/d' | sort -u)

          fork_opendbc="$(git rev-parse HEAD:opendbc_repo)"
          required_opendbc="$(git rev-parse "$source:opendbc_repo")"
          # Preserve the branch's reviewed Subaru pin. Do not silently advance
          # to a different opendbc branch or discard the Subaru changes.
          opendbc_check="$(mktemp -d)"
          git init "$opendbc_check"
          git -C "$opendbc_check" fetch --no-tags https://github.com/jgerega107/opendbc.git "$fork_opendbc"
          git -C "$opendbc_check" fetch --no-tags https://github.com/commaai/opendbc.git "$required_opendbc"
          if ! git -C "$opendbc_check" merge-base --is-ancestor "$required_opendbc" "$fork_opendbc"; then
            echo "Subaru opendbc pin must incorporate $required_opendbc before syncing" >&2
            exit 1
          fi

          # A rebase replays each fork commit; it does not create a sync/merge
          # commit. Resolve only the known submodule pin conflict. Other
          # conflicts fail without publishing anything.
          if ! GIT_EDITOR=true git rebase --onto "$source" "$base"; then
            while test -d .git/rebase-merge || test -d .git/rebase-apply; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if (( ${#conflicts[@]} != 1 )) || test "${conflicts[0]}" != opendbc_repo; then
                git status --short >&2
                echo "Replay conflict requires manual review" >&2
                exit 1
              fi
              git update-index --cacheinfo "160000,$fork_opendbc,opendbc_repo"
              GIT_EDITOR=true git rebase --continue || {
                test -d .git/rebase-merge || test -d .git/rebase-apply
              }
            done
          fi
          git merge-base --is-ancestor "$source" HEAD
          test -z "$(git rev-list --merges "$source..HEAD")"
          test "$(git rev-parse HEAD:opendbc_repo)" = "$fork_opendbc"
          test "$(git config -f .gitmodules --get submodule.opendbc.url)" = ../../jgerega107/opendbc.git
          git diff --check "$source" HEAD
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "fork_opendbc=$fork_opendbc" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify synchronized source checkout
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          test ! -e prebuilt
          test -z "$(git submodule status --recursive | grep '^[-+]' || true)"
          grep -q SUBARU_CROSSTREK_2025 opendbc_repo/opendbc/car/subaru/values.py
          test "$(git -C opendbc_repo rev-parse HEAD)" = "${{ steps.sync.outputs.fork_opendbc }}"

      - name: Publish replayed branch
        if: steps.sync.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.sync.outputs.before }}
        run: git push --force-with-lease="refs/heads/release-mici-crosstrek-2025:$BEFORE" origin HEAD:refs/heads/release-mici-crosstrek-2025
